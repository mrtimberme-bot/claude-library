<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Library — Rows</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09090b;
      --surface: #111113;
      --surface2: #18181b;
      --surface3: #27272a;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
      --primary: #3b82f6;
      --green: #22c55e;
      --amber: #f59e0b;
      --text: #fafafa;
      --text2: #a1a1aa;
      --text3: #71717a;
      --text4: #3f3f46;
      --skill: #22c55e;
      --agent: #f97316;
      --mcp: #3b82f6;
      --memory: #a855f7;
      --snippet: #7c3aed;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    /* ── Filter bar (sticky) ── */
    .filter-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9,9,11,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 1.75rem;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .filter-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-right: 0.25rem;
    }

    .pill {
      padding: 0.3rem 0.875rem;
      border-radius: 20px;
      font-size: 0.8125rem;
      font-weight: 500;
      border: 1px solid var(--border2);
      color: var(--text2);
      background: var(--surface2);
      cursor: pointer;
      transition: all 0.15s ease;
      line-height: 1;
    }

    .pill.active, .pill:hover {
      background: var(--surface3);
      border-color: rgba(255,255,255,0.22);
      color: var(--text);
    }

    .pill.pill-skill   { color: var(--skill);   border-color: rgba(34,197,94,0.3);   background: rgba(34,197,94,0.07); }
    .pill.pill-agent   { color: var(--agent);   border-color: rgba(249,115,22,0.3);  background: rgba(249,115,22,0.07); }
    .pill.pill-mcp     { color: var(--mcp);     border-color: rgba(59,130,246,0.3);  background: rgba(59,130,246,0.07); }
    .pill.pill-memory  { color: var(--memory);  border-color: rgba(168,85,247,0.3);  background: rgba(168,85,247,0.07); }
    .pill.pill-snippet { color: var(--snippet); border-color: rgba(124,58,237,0.3);  background: rgba(124,58,237,0.07); }

    /* ── Main ── */
    .main {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem 1.75rem 3rem;
    }

    /* ── Rows ── */
    .rows {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    @keyframes row-in {
      from { opacity: 0; transform: translateX(-20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .row {
      --type-color: var(--primary);
      position: relative;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.875rem 1rem;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      cursor: default;
      opacity: 0;
      animation: row-in 0.38s cubic-bezier(0.16,1,0.3,1) forwards;
      transition: background 0.15s ease;
      overflow: hidden;
    }

    .row:first-child { border-top: 1px solid var(--border); }

    .row:hover {
      background: var(--surface3);
    }

    .row:hover .row-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .row[data-type="skill"]   { --type-color: var(--skill); }
    .row[data-type="agent"]   { --type-color: var(--agent); }
    .row[data-type="mcp"]     { --type-color: var(--mcp); }
    .row[data-type="memory"]  { --type-color: var(--memory); }
    .row[data-type="snippet"] { --type-color: var(--snippet); }

    .row-accent {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--type-color);
      border-radius: 0;
    }

    .row-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--type-color);
      letter-spacing: -0.02em;
      margin-left: 0.75rem;
    }

    .row-body {
      flex: 1;
      display: flex;
      align-items: baseline;
      gap: 0.875rem;
      min-width: 0;
    }

    .row-name {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .row-sep {
      color: var(--text4);
      font-size: 0.8125rem;
      flex-shrink: 0;
    }

    .row-desc {
      font-size: 0.8125rem;
      color: var(--text3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6875rem;
      color: var(--text3);
      background: var(--surface3);
      border-radius: 4px;
      padding: 0.15rem 0.45rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    .row-arrow {
      font-size: 1rem;
      color: var(--text3);
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      margin-left: 0.25rem;
    }
  </style>
</head>
<body>

  <div class="filter-bar">
    <span class="filter-label">Filter</span>
    <button class="pill active">All</button>
    <button class="pill pill-skill">Skill</button>
    <button class="pill pill-agent">Agent</button>
    <button class="pill pill-mcp">MCP</button>
    <button class="pill pill-memory">Memory</button>
    <button class="pill pill-snippet">Snippet</button>
  </div>

  <main class="main">
    <div class="rows" id="rows"></div>
  </main>

  <script>
    const components = [
      { name:"Frontend Design",  type:"skill",   desc:"Production-ready HTML/CSS/JS interfaces", tags:["html","css","ui"] },
      { name:"Debug Detective",  type:"skill",   desc:"Crash analysis and Sentry payload debugging", tags:["debug","crash"] },
      { name:"Research Agent",   type:"agent",   desc:"Autonomous web research with structured report", tags:["research","autonomy"] },
      { name:"Google Drive MCP", type:"mcp",     desc:"Search, read and upload files to Google Drive", tags:["google","drive"] },
      { name:"Animated Navbar",  type:"snippet", desc:"Pill navbar with sliding indicator and tooltip", tags:["css","animation"] },
      { name:"Theme Toggle",     type:"snippet", desc:"Dark/light toggle with moon/sun emoji transition", tags:["css","toggle"] },
      { name:"iOS Baseline",     type:"skill",   desc:"Swift 6 + SwiftUI conventions for every iOS task", tags:["ios","swift"] },
      { name:"CLAUDE.md Memory", type:"memory",  desc:"Persistent project context via CLAUDE.md files", tags:["memory","context"] }
    ];

    const rows = document.getElementById('rows');

    components.forEach(function(c, i) {
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.type = c.type;
      row.style.animationDelay = (i * 55) + 'ms';

      const accent = document.createElement('div');
      accent.className = 'row-accent';

      const icon = document.createElement('div');
      icon.className = 'row-icon';
      icon.textContent = c.type.charAt(0).toUpperCase();

      const body = document.createElement('div');
      body.className = 'row-body';

      const nameEl = document.createElement('span');
      nameEl.className = 'row-name';
      nameEl.textContent = c.name;

      const sep = document.createElement('span');
      sep.className = 'row-sep';
      sep.textContent = '—';

      const descEl = document.createElement('span');
      descEl.className = 'row-desc';
      descEl.textContent = c.desc;

      body.appendChild(nameEl);
      body.appendChild(sep);
      body.appendChild(descEl);

      const right = document.createElement('div');
      right.className = 'row-right';

      c.tags.slice(0, 2).forEach(function(t) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = t;
        right.appendChild(tag);
      });

      const dot = document.createElement('span');
      dot.className = 'status-dot';
      right.appendChild(dot);

      const arrow = document.createElement('span');
      arrow.className = 'row-arrow';
      arrow.textContent = '→';
      right.appendChild(arrow);

      row.appendChild(accent);
      row.appendChild(icon);
      row.appendChild(body);
      row.appendChild(right);
      rows.appendChild(row);
    });
  </script>
</body>
</html>
