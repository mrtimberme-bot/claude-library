<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Library — Bento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09090b;
      --surface: #111113;
      --surface2: #18181b;
      --surface3: #27272a;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
      --primary: #3b82f6;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --text: #fafafa;
      --text2: #a1a1aa;
      --text3: #71717a;
      --text4: #3f3f46;
      --skill: #22c55e;
      --agent: #f97316;
      --mcp: #3b82f6;
      --memory: #a855f7;
      --snippet: #7c3aed;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1.5rem 2rem 0;
      margin-bottom: 1.5rem;
    }

    .topbar h1 {
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .topbar h1 span { color: var(--primary); }

    .topbar-sub {
      font-size: 0.8125rem;
      color: var(--text3);
    }

    .main {
      padding: 0 2rem 3rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Bento grid */
    .bento {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 180px);
      gap: 0.875rem;
    }

    /* Featured: col 1-2, row 1-2 */
    .cell:nth-child(1) {
      grid-column: 1 / 3;
      grid-row: 1 / 3;
    }

    /* Tall cards: col 3, row 1-2 and col 4, row 1-2 */
    .cell:nth-child(2) {
      grid-column: 3 / 4;
      grid-row: 1 / 3;
    }

    .cell:nth-child(3) {
      grid-column: 4 / 5;
      grid-row: 1 / 3;
    }

    /* Bottom row: cells 4-8 fill columns 1-4, row 3 */
    .cell:nth-child(4) { grid-column: 1 / 2; grid-row: 3 / 4; }
    .cell:nth-child(5) { grid-column: 2 / 3; grid-row: 3 / 4; }
    .cell:nth-child(6) { grid-column: 3 / 4; grid-row: 3 / 4; }
    .cell:nth-child(7) { grid-column: 4 / 5; grid-row: 3 / 4; }

    @keyframes cell-in {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    .cell {
      --type-color: var(--primary);
      --type-color-rgb: 59,130,246;
      position: relative;
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 1.25rem;
      overflow: hidden;
      cursor: default;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      opacity: 0;
      animation: cell-in 0.4s cubic-bezier(0.16,1,0.3,1) forwards;
      transition: transform 0.2s cubic-bezier(0.16,1,0.3,1), box-shadow 0.2s ease;
    }

    .cell::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at top left, rgba(var(--type-color-rgb),0.12) 0%, transparent 65%);
      pointer-events: none;
      border-radius: inherit;
    }

    .cell:hover {
      transform: scale(1.015);
      box-shadow: 0 12px 32px rgba(0,0,0,0.45), 0 0 0 1px rgba(var(--type-color-rgb),0.3);
    }

    .cell[data-type="skill"]   { --type-color: var(--skill);   --type-color-rgb: 34,197,94; }
    .cell[data-type="agent"]   { --type-color: var(--agent);   --type-color-rgb: 249,115,22; }
    .cell[data-type="mcp"]     { --type-color: var(--mcp);     --type-color-rgb: 59,130,246; }
    .cell[data-type="memory"]  { --type-color: var(--memory);  --type-color-rgb: 168,85,247; }
    .cell[data-type="snippet"] { --type-color: var(--snippet); --type-color-rgb: 124,58,237; }

    .cell-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--type-color);
      background: rgba(var(--type-color-rgb), 0.12);
      border: 1px solid rgba(var(--type-color-rgb), 0.2);
      width: fit-content;
    }

    .cell-badge-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--type-color);
    }

    .cell-name {
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.2;
    }

    .cell:nth-child(1) .cell-name { font-size: 1.5rem; margin-top: 0.25rem; }
    .cell:nth-child(2) .cell-name,
    .cell:nth-child(3) .cell-name { font-size: 1.0625rem; }
    .cell .cell-name              { font-size: 0.9375rem; }

    .cell-desc {
      font-size: 0.8125rem;
      color: var(--text2);
      line-height: 1.55;
      flex: 1;
    }

    .cell:nth-child(1) .cell-desc { font-size: 0.9375rem; }

    .cell-tags {
      display: flex;
      gap: 0.375rem;
      flex-wrap: wrap;
      margin-top: auto;
    }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6875rem;
      color: var(--text3);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.15rem 0.45rem;
    }

    /* stagger via nth-child */
    .cell:nth-child(1) { animation-delay: 0ms; }
    .cell:nth-child(2) { animation-delay: 60ms; }
    .cell:nth-child(3) { animation-delay: 120ms; }
    .cell:nth-child(4) { animation-delay: 180ms; }
    .cell:nth-child(5) { animation-delay: 240ms; }
    .cell:nth-child(6) { animation-delay: 300ms; }
    .cell:nth-child(7) { animation-delay: 360ms; }
    .cell:nth-child(8) { animation-delay: 420ms; }
  </style>
</head>
<body>

  <div class="topbar">
    <h1>Claude <span>Library</span></h1>
    <span class="topbar-sub">— 8 components</span>
  </div>

  <main class="main">
    <div class="bento" id="bento"></div>
  </main>

  <script>
    const components = [
      { name:"Frontend Design",  type:"skill",   desc:"Production-ready HTML/CSS/JS interfaces for Claude Code projects", tags:["html","css","ui"] },
      { name:"Debug Detective",  type:"skill",   desc:"Crash analysis and Sentry payload debugging", tags:["debug","crash"] },
      { name:"Research Agent",   type:"agent",   desc:"Autonomous web research with structured report", tags:["research","autonomy"] },
      { name:"Google Drive MCP", type:"mcp",     desc:"Search, read and upload files to Google Drive", tags:["google","drive"] },
      { name:"Animated Navbar",  type:"snippet", desc:"Pill navbar with sliding indicator and tooltip", tags:["css","animation"] },
      { name:"Theme Toggle",     type:"snippet", desc:"Dark/light toggle with moon/sun emoji transition", tags:["css","toggle"] },
      { name:"iOS Baseline",     type:"skill",   desc:"Swift 6 + SwiftUI conventions for every iOS task", tags:["ios","swift"] },
      { name:"CLAUDE.md Memory", type:"memory",  desc:"Persistent project context via CLAUDE.md files", tags:["memory","context"] }
    ];

    const bento = document.getElementById('bento');

    components.forEach(function(c) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.type = c.type;

      const badge = document.createElement('div');
      badge.className = 'cell-badge';
      const dot = document.createElement('span');
      dot.className = 'cell-badge-dot';
      const badgeText = document.createTextNode(c.type);
      badge.appendChild(dot);
      badge.appendChild(badgeText);

      const name = document.createElement('div');
      name.className = 'cell-name';
      name.textContent = c.name;

      const desc = document.createElement('div');
      desc.className = 'cell-desc';
      desc.textContent = c.desc;

      const tags = document.createElement('div');
      tags.className = 'cell-tags';
      c.tags.forEach(function(t) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = t;
        tags.appendChild(tag);
      });

      cell.appendChild(badge);
      cell.appendChild(name);
      cell.appendChild(desc);
      cell.appendChild(tags);
      bento.appendChild(cell);
    });
  </script>
</body>
</html>
