<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Library — Grid Stagger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09090b;
      --surface: #111113;
      --surface2: #18181b;
      --surface3: #27272a;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
      --primary: #3b82f6;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --text: #fafafa;
      --text2: #a1a1aa;
      --text3: #71717a;
      --text4: #3f3f46;
      --skill: #22c55e;
      --agent: #f97316;
      --mcp: #3b82f6;
      --memory: #a855f7;
      --snippet: #7c3aed;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0 1.5rem;
      height: 56px;
      background: rgba(9,9,11,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9375rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      white-space: nowrap;
    }

    .topbar-logo svg {
      width: 22px;
      height: 22px;
      color: var(--primary);
    }

    .search {
      flex: 1;
      max-width: 360px;
      position: relative;
    }

    .search input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.75rem 0.5rem 2.25rem;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .search input::placeholder { color: var(--text3); }
    .search input:focus { border-color: var(--border2); }

    .search svg {
      position: absolute;
      left: 0.625rem;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--text3);
      pointer-events: none;
    }

    .topbar-count {
      font-size: 0.8125rem;
      color: var(--text3);
      white-space: nowrap;
    }

    .main {
      padding: 2rem 1.5rem 3rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 1.25rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card {
      --type-color: var(--primary);
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--type-color);
      border-radius: 10px;
      padding: 1.125rem 1.125rem 1rem;
      cursor: default;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      opacity: 0;
      animation: card-in 0.45s cubic-bezier(0.16,1,0.3,1) forwards;
      transition: transform 0.2s cubic-bezier(0.16,1,0.3,1),
                  box-shadow 0.2s ease,
                  border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 0 1px var(--type-color), 0 8px 24px rgba(0,0,0,0.4);
      border-top-color: rgba(255,255,255,0.14);
      border-right-color: rgba(255,255,255,0.14);
      border-bottom-color: rgba(255,255,255,0.14);
    }

    .card[data-type="skill"]   { --type-color: var(--skill); }
    .card[data-type="agent"]   { --type-color: var(--agent); }
    .card[data-type="mcp"]     { --type-color: var(--mcp); }
    .card[data-type="memory"]  { --type-color: var(--memory); }
    .card[data-type="snippet"] { --type-color: var(--snippet); }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .card-name {
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
      line-height: 1.3;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
      box-shadow: 0 0 6px var(--green);
    }

    .card-desc {
      font-size: 0.8125rem;
      color: var(--text2);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      flex-wrap: wrap;
      margin-top: auto;
    }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6875rem;
      color: var(--text3);
      background: var(--surface3);
      border-radius: 4px;
      padding: 0.15rem 0.45rem;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
      Claude Library
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" placeholder="Search components…" />
    </div>
    <span class="topbar-count">8 components</span>
  </header>

  <main class="main">
    <p class="section-label">All components</p>
    <div class="grid" id="grid"></div>
  </main>

  <script>
    const components = [
      { name:"Frontend Design",  type:"skill",   desc:"Production-ready HTML/CSS/JS interfaces", tags:["html","css","ui"] },
      { name:"Debug Detective",  type:"skill",   desc:"Crash analysis and Sentry payload debugging", tags:["debug","crash"] },
      { name:"Research Agent",   type:"agent",   desc:"Autonomous web research with structured report", tags:["research","autonomy"] },
      { name:"Google Drive MCP", type:"mcp",     desc:"Search, read and upload files to Google Drive", tags:["google","drive"] },
      { name:"Animated Navbar",  type:"snippet", desc:"Pill navbar with sliding indicator and tooltip", tags:["css","animation"] },
      { name:"Theme Toggle",     type:"snippet", desc:"Dark/light toggle with moon/sun emoji transition", tags:["css","toggle"] },
      { name:"iOS Baseline",     type:"skill",   desc:"Swift 6 + SwiftUI conventions for every iOS task", tags:["ios","swift"] },
      { name:"CLAUDE.md Memory", type:"memory",  desc:"Persistent project context via CLAUDE.md files", tags:["memory","context"] }
    ];

    const grid = document.getElementById('grid');

    components.forEach(function(c, i) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.type = c.type;
      card.style.animationDelay = (i * 60) + 'ms';

      const header = document.createElement('div');
      header.className = 'card-header';

      const name = document.createElement('span');
      name.className = 'card-name';
      name.textContent = c.name;

      const dot = document.createElement('span');
      dot.className = 'status-dot';
      dot.title = 'Active';

      header.appendChild(name);
      header.appendChild(dot);

      const desc = document.createElement('p');
      desc.className = 'card-desc';
      desc.textContent = c.desc;

      const footer = document.createElement('div');
      footer.className = 'card-footer';

      c.tags.forEach(function(t) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = t;
        footer.appendChild(tag);
      });

      card.appendChild(header);
      card.appendChild(desc);
      card.appendChild(footer);
      grid.appendChild(card);
    });
  </script>
</body>
</html>
