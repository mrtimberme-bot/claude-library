compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "LIBRARY_CACHE"
id = "89667868304945a8955d2089baa8d3e8"

[triggers]
crons = ["0 6 * * *"]

[vars]
LIBRARY_REPO = "mrtimberme-bot/claude-library"

